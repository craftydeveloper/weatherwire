<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f7fb"><title>WeatherWire</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#182230;background:#f5f7fb;font-synthesis:none}*{box-sizing:border-box}body{margin:0}.shell{max-width:1080px;margin:0 auto;padding:32px 22px 60px}.top{display:flex;align-items:center;gap:12px;margin-bottom:48px}.mark{width:34px;height:34px;border-radius:11px;background:#1e5eff;color:white;display:grid;place-items:center;font-weight:800}.brand{font-weight:750;letter-spacing:-.03em}.tag{color:#6c7788;font-size:14px}.hero{max-width:680px;margin-bottom:32px}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:#1e5eff;font-weight:700}.hero h1{font-size:clamp(36px,6vw,56px);line-height:1.02;letter-spacing:-.06em;margin:10px 0}.hero p{color:#657184;line-height:1.6;margin:0}.grid{display:grid;grid-template-columns:minmax(270px,340px) 1fr;gap:18px;align-items:start}.panel{background:white;border:1px solid #e1e7f0;border-radius:16px;padding:20px;box-shadow:0 8px 26px #26344b0a}.panel h2{font-size:16px;margin:0 0 16px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;font-weight:650;color:#526075}.field input,.field textarea,.field select,.search{width:100%;border:1px solid #d9e0eb;border-radius:9px;padding:10px 11px;font:inherit;font-size:13px;background:#fff;color:#182230}.field textarea{min-height:90px;resize:vertical}.actions{display:flex;gap:8px;align-items:center;margin-top:16px}.btn{border:0;border-radius:9px;padding:10px 13px;background:#1e5eff;color:white;font-weight:700;cursor:pointer}.btn.secondary{background:#eef2f8;color:#344054}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px}.toolbar h2{margin:0 auto 0 0}.search{max-width:220px}.count{font-size:12px;color:#738096}.cards{display:grid;gap:11px}.card{border:1px solid #e4e9f1;border-radius:12px;padding:15px;background:#fff}.cardhead{display:flex;justify-content:space-between;gap:10px;align-items:center}.card h3{font-size:14px;margin:0;overflow-wrap:anywhere}.badge{font-size:11px;padding:5px 8px;border-radius:99px;background:#eef3ff;color:#2454c6}.data{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}.datum{min-width:0}.datum label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#8490a2;margin-bottom:4px}.datum div{font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;color:#354258;max-height:150px;overflow:auto}.cardactions{display:flex;gap:7px;margin-top:12px}.cardactions button{border:1px solid #dce3ed;background:#fff;border-radius:7px;padding:6px 9px;color:#455266;font-size:11px;cursor:pointer}.empty{color:#788599;text-align:center;padding:35px 10px;font-size:13px}.foot{color:#8a95a5;font-size:11px;margin-top:14px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#172234;color:#fff;border-radius:10px;padding:10px 14px;font-size:12px;display:none}@media(max-width:760px){.grid{grid-template-columns:1fr}.top{margin-bottom:32px}.data{grid-template-columns:1fr}.toolbar{flex-wrap:wrap}.search{max-width:none;flex:1}}
</style></head><body><main class="shell"><div class="top"><div class="mark">W</div><div><div class="brand">WeatherWire</div><div class="tag">Local-first starter</div></div></div><header class="hero"><div class="eyebrow">Project workspace</div><h1>WeatherWire</h1><p>Organize weather locations, observations, and alert notes.</p></header><div class="grid"><section class="panel"><h2 id="form-title">Add weather note</h2><form id="record-form"></form><div class="actions"><button class="btn" type="submit" form="record-form" id="save-btn">Save __NOUN__</button><button class="btn secondary" type="button" id="cancel-btn" hidden>Cancel</button></div><p class="foot">Saved in this browser only. This starter does not call external AI services or publish data.</p></section><section class="panel"><div class="toolbar"><h2>Your workspace</h2><input class="search" id="search" placeholder="Search records"><span class="count" id="count"></span></div><div class="cards" id="cards"></div></section></div></main><div class="toast" id="toast"></div><script>
const cfg={"slug":"weatherwire","noun":"weather note","fields":[{"key":"location","label":"Location","type":"text"},{"key":"observation","label":"Observation","type":"textarea"},{"key":"condition","label":"Condition","type":"text"},{"key":"alert","label":"Alert or follow-up","type":"textarea"}]};const form=document.getElementById('record-form');const cards=document.getElementById('cards');const search=document.getElementById('search');let editing=null;function read(){try{return JSON.parse(localStorage.getItem('starter-'+cfg.slug)||'[]')}catch(e){return []}}function save(items){localStorage.setItem('starter-'+cfg.slug,JSON.stringify(items))}function node(tag,className,text){const n=document.createElement(tag);if(className)n.className=className;if(text!==undefined)n.textContent=text;return n}function buildForm(){cfg.fields.forEach(function(f){const wrap=node('div','field');const label=node('label','',f.label);let input;if(f.type==='textarea'){input=node('textarea')}else if(f.type==='select'){input=node('select');f.options.forEach(function(value){const option=node('option','',value);option.value=value;input.appendChild(option)})}else{input=node('input');input.type=f.type||'text';if(f.type==='number')input.step='any'}input.name=f.key;input.required=true;wrap.append(label,input);form.appendChild(wrap)})}function toast(text){const t=document.getElementById('toast');t.textContent=text;t.style.display='block';setTimeout(function(){t.style.display='none'},1500)}function render(){const all=read();const q=search.value.toLowerCase().trim();const list=all.filter(function(r){return JSON.stringify(r.values).toLowerCase().includes(q)});document.getElementById('count').textContent=list.length+' / '+all.length;cards.replaceChildren();if(!list.length){cards.appendChild(node('div','empty','No records yet. Add your first '+cfg.noun+'.'));return}list.forEach(function(r){const article=node('article','card');const head=node('div','cardhead');head.appendChild(node('h3','',r.values[cfg.fields[0].key]||cfg.noun));head.appendChild(node('span','badge',r.values.status||r.values.type||'Saved'));article.appendChild(head);const data=node('div','data');cfg.fields.forEach(function(f){const datum=node('div','datum');datum.appendChild(node('label','',f.label));datum.appendChild(node('div','',r.values[f.key]||''));data.appendChild(datum)});article.appendChild(data);const actions=node('div','cardactions');[['edit','Edit'],['delete','Delete']].forEach(function(pair){const button=node('button','',pair[1]);button.type='button';button.dataset.action=pair[0];button.dataset.id=r.id;actions.appendChild(button)});article.appendChild(actions);cards.appendChild(article)})}function resetForm(){form.reset();editing=null;document.getElementById('form-title').textContent='Add '+cfg.noun;document.getElementById('save-btn').textContent='Save '+cfg.noun;document.getElementById('cancel-btn').hidden=true}form.addEventListener('submit',function(event){event.preventDefault();const values={};const data=new FormData(form);cfg.fields.forEach(function(f){values[f.key]=String(data.get(f.key)||'').trim()});let items=read();if(editing){items=items.map(function(item){return item.id===editing?{id:item.id,createdAt:item.createdAt,updatedAt:new Date().toISOString(),values:values}:item});toast('Updated')}else{items.unshift({id:Date.now().toString()+'-'+Math.random().toString(16).slice(2),createdAt:new Date().toISOString(),values:values});toast('Saved')}save(items);resetForm();render()});cards.addEventListener('click',function(event){const button=event.target.closest('button[data-action]');if(!button)return;const id=button.dataset.id;let items=read();if(button.dataset.action==='delete'){if(confirm('Delete this record?')){save(items.filter(function(item){return item.id!==id}));render();toast('Deleted')}return}const record=items.find(function(item){return item.id===id});if(!record)return;editing=id;cfg.fields.forEach(function(f){form.elements.namedItem(f.key).value=record.values[f.key]||''});document.getElementById('form-title').textContent='Edit '+cfg.noun;document.getElementById('save-btn').textContent='Update '+cfg.noun;document.getElementById('cancel-btn').hidden=false;window.scrollTo({top:0,behavior:'smooth'})});document.getElementById('cancel-btn').addEventListener('click',resetForm);search.addEventListener('input',render);buildForm();render();
</script></body></html>

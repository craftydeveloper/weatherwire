:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#182230;background:#f5f7fb;font-synthesis:none}*{box-sizing:border-box}body{margin:0}.shell{max-width:1080px;margin:0 auto;padding:32px 22px 60px}.top{display:flex;align-items:center;gap:12px;margin-bottom:48px}.mark{width:34px;height:34px;border-radius:11px;background:#1e5eff;color:white;display:grid;place-items:center;font-weight:800}.brand{font-weight:750;letter-spacing:-.03em}.tag{color:#6c7788;font-size:14px}.hero{max-width:680px;margin-bottom:32px}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:#1e5eff;font-weight:700}.hero h1{font-size:clamp(36px,6vw,56px);line-height:1.02;letter-spacing:-.06em;margin:10px 0}.hero p{color:#657184;line-height:1.6;margin:0}.grid{display:grid;grid-template-columns:minmax(270px,340px) 1fr;gap:18px;align-items:start}.panel{background:white;border:1px solid #e1e7f0;border-radius:16px;padding:20px;box-shadow:0 8px 26px #26344b0a}.panel h2{font-size:16px;margin:0 0 16px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;font-weight:650;color:#526075}.field input,.field textarea,.field select,.search{width:100%;border:1px solid #d9e0eb;border-radius:9px;padding:10px 11px;font:inherit;font-size:13px;background:#fff;color:#182230}.field textarea{min-height:90px;resize:vertical}.actions{display:flex;gap:8px;align-items:center;margin-top:16px}.btn{border:0;border-radius:9px;padding:10px 13px;background:#1e5eff;color:white;font-weight:700;cursor:pointer}.btn.secondary{background:#eef2f8;color:#344054}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px}.toolbar h2{margin:0 auto 0 0}.search{max-width:220px}.count{font-size:12px;color:#738096}.cards{display:grid;gap:11px}.card{border:1px solid #e4e9f1;border-radius:12px;padding:15px;background:#fff}.cardhead{display:flex;justify-content:space-between;gap:10px;align-items:center}.card h3{font-size:14px;margin:0;overflow-wrap:anywhere}.badge{font-size:11px;padding:5px 8px;border-radius:99px;background:#eef3ff;color:#2454c6}.data{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}.datum{min-width:0}.datum label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#8490a2;margin-bottom:4px}.datum div{font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;color:#354258;max-height:150px;overflow:auto}.cardactions{display:flex;gap:7px;margin-top:12px}.cardactions button{border:1px solid #dce3ed;background:#fff;border-radius:7px;padding:6px 9px;color:#455266;font-size:11px;cursor:pointer}.empty{color:#788599;text-align:center;padding:35px 10px;font-size:13px}.foot{color:#8a95a5;font-size:11px;margin-top:14px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#172234;color:#fff;border-radius:10px;padding:10px 14px;font-size:12px;display:none}@media(max-width:760px){.grid{grid-template-columns:1fr}.top{margin-bottom:32px}.data{grid-template-columns:1fr}.toolbar{flex-wrap:wrap}.search{max-width:none;flex:1}}
</style></head><body><main class="shell"><div class="top"><div class="mark">W</div><div><div class="brand">WeatherWire</div><div class="tag">Local-first starter</div></div></div><header class="hero"><div class="eyebrow">Project workspace</div><h1>WeatherWire</h1><p>Organize weather locations, observations, and alert notes.</p></header><div class="grid"><section class="panel"><h2 id="form-title">Add weather note</h2><form id="record-form"></form><div class="actions"><button class="btn" type="submit" form="record-form" id="save-btn">Save __NOUN__</button><button class="btn secondary" type="button" id="cancel-btn" hidden>Cancel</button></div><p class="foot">Saved in this browser only. This starter does not call external AI services or publish data.</p></section><section class="panel"><div class="toolbar"><h2>Your workspace</h2><input class="search" id="search" placeholder="Search records"><span class="count" id="count"></span></div><div class="cards" id="cards"></div></section></div></main><div class="toast" id="toast"></div><script>
const cfg={"slug":"weatherwire","noun":"weather note","fields":[{"key":"location","label":"Location","type":"text"},{"key":"observation","label":"Observation","type":"textarea"},{"key":"condition","label":"Condition","type":"text"},{"key":"alert","label":"Alert or follow-up","type":"textarea"}]};const key="starter-"+cfg.slug;const form=document.getElementById("record-form");const cards=document.getElementById("cards");const search=document.getElementById("search");let editing=null;function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",""":"&quot;","'":"&#39;"}[c]})}function read(){try{return JSON.parse(localStorage.getItem(key)||"[]")}catch(e){return []}}function save(list){localStorage.setItem(key,JSON.stringify(list))}function buildForm(){form.innerHTML=cfg.fields.map(function(f){let input;if(f.type==="textarea"){input="<textarea name=""+f.key+"" required></textarea>"}else if(f.type==="select"){input="<select name=""+f.key+"">"+f.options.map(function(o){return "<option>"+esc(o)+"</option>"}).join("")+"</select>"}else{input="<input name=""+f.key+"" type=""+(f.type||"text")+"" "+(f.type==="number"?"step="any"":"")+">"}return "<div class="field"><label>"+esc(f.label)+"</label>"+input+"</div>"}).join("")}function toast(text){const t=document.getElementById("toast");t.textContent=text;t.style.display="block";setTimeout(function(){t.style.display="none"},1500)}function render(){const all=read();const q=search.value.toLowerCase().trim();const list=all.filter(function(r){return JSON.stringify(r).toLowerCase().includes(q)});document.getElementById("count").textContent=list.length+" / "+all.length;cards.innerHTML=list.length?list.map(function(r){const fields=cfg.fields.map(function(f){return "<div class="datum"><label>"+esc(f.label)+"</label><div>"+esc(r.values[f.key])+"</div></div>"}).join("");return "<article class="card"><div class="cardhead"><h3>"+esc(r.values[cfg.fields[0].key]||cfg.noun)+"</h3><span class="badge">"+esc(r.values.status||r.values.type||"Saved")+"</span></div><div class="data">"+fields+"</div><div class="cardactions"><button data-action="edit" data-id=""+r.id+"">Edit</button><button data-action="delete" data-id=""+r.id+"">Delete</button></div></article>"}).join(""):"<div class="empty">No records yet. Add your first "+esc(cfg.noun)+".</div>"}form.addEventListener("submit",function(e){e.preventDefault();const values={};cfg.fields.forEach(function(f){values[f.key]=form.elements.namedItem(f.key).value.trim()});let all=read();if(editing){all=all.map(function(r){return r.id===editing?{id:r.id,updatedAt:new Date().toISOString(),values:values}:r});toast("Updated") }else{all.unshift({id:Date.now().toString(),createdAt:new Date().toISOString(),values:values});toast("Saved")};save(all);form.reset();editing=null;document.getElementById("form-title").textContent="Add "+cfg.noun;document.getElementById("save-btn").textContent="Save "+cfg.noun;document.getElementById("cancel-btn").hidden=true;render()});cards.addEventListener("click",async function(e){const b=e.target.closest("button[data-action]");if(!b)return;const id=b.dataset.id;let all=read();if(b.dataset.action==="delete"){if(confirm("Delete this record?")){save(all.filter(function(r){return r.id!==id}));render();toast("Deleted")}}else{const r=all.find(function(x){return x.id===id});if(!r)return;editing=id;cfg.fields.forEach(function(f){form.elements.namedItem(f.key).value=r.values[f.key]||""});document.getElementById("form-title").textContent="Edit "+cfg.noun;document.getElementById("save-btn").textContent="Update "+cfg.noun;document.getElementById("cancel-btn").hidden=false;window.scrollTo({top:0,behavior:"smooth"})}});document.getElementById("cancel-btn").addEventListener("click",function(){form.reset();editing=null;document.getElementById("form-title").textContent="Add "+cfg.noun;document.getElementById("save-btn").textContent="Save "+cfg.noun;this.hidden=true});search.addEventListener("input",render);buildForm();render();
